<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>RoadLink player</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  iframe { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; }
  p { color: #9aa4b4; font: 16px/1.4 "Segoe UI", Arial, sans-serif; text-align: center; margin-top: 40vh; }
</style>
</head>
<body>
<!--
  RoadLink player page.
  YouTube only plays embedded videos on pages that have a real web address. The RoadLink mod for
  BeamNG.drive runs inside the game, where pages have none, so it opens this page instead:
  index.html?v=<11-character YouTube video id>
  This page stores nothing and sends nothing anywhere except loading YouTube's own player.
-->
<script>
(function () {
  var m = /[?&]v=([A-Za-z0-9_-]{11})(?:&|$)/.exec(location.search);
  if (!m) { document.body.innerHTML = '<p>RoadLink player: no video selected.</p>'; return; }
  var f = document.createElement('iframe');
  f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.allowFullscreen = true;
  f.src = 'https://www.youtube.com/embed/' + m[1] + '?autoplay=1&rel=0&playsinline=1';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
